name: Failed Windows preserved-DELTA ACL input

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact fixed public reserve SUT commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  preserved-delta-acl-input:
    name: One failed preserved-DELTA case / Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SUT_COMMIT: ${{ inputs.commit }}
      GARDA_SYNTHETIC_WALK_ONLY: field-onlinestore-passed-delta-after-test-repair
      GARDA_SYNTHETIC_WALK_LEVEL: full
      GARDA_SYNTHETIC_WALK_JOBS: '1'
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate exact diagnostic source
        run: node -e 'if(!/^[a-f0-9]{40}$/.test(process.env.SUT_COMMIT))throw Error("Full commit SHA required")'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Assert the checked-out SUT and Windows runtime
        run: |
          node -e 'const cp=require("node:child_process"),a=require("node:assert/strict");a.equal(cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.SUT_COMMIT);a.equal(process.platform,"win32");a.equal(process.versions.node.split(".")[0],"24")'
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Set isolated diagnostic directory
        run: printf 'GARDA_SYNTHETIC_WALK_REPORT=%s/windows-preserved-delta-acl-input\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify new native fixture inherited explicit and mutation controls
        run: |
          export PATH="/c/Windows/System32:$PATH"
          node scripts/node-foundation/build-scripts.cjs test.js --garda-shard-timeout-ms 300000 \
            tests/node/synthetic/synthetic-windows-acl-fixture.test.ts
      - name: Run only the failed native stand scenario
        run: |
          export PATH="/c/Windows/System32:$PATH"
          node scripts/node-foundation/build-scripts.cjs test.js --garda-shard-timeout-ms 1200000 \
            tests/node/synthetic/synthetic-navigator-walk.test.ts
      - name: Refuse missing functional reuse or work-budget evidence
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const root=process.env.GARDA_SYNTHETIC_WALK_REPORT;
          const read=file=>JSON.parse(fs.readFileSync(path.join(root,file),'utf8'));
          const hash=value=>crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const partial=read('partial-findings.json'),id='field-onlinestore-passed-delta-after-test-repair';
          assert.equal(partial.partial,true);assert.equal(partial.completed,1);assert.equal(partial.total,1);
          assert.deepEqual(partial.findings,[]);assert.deepEqual(partial.scenarios.map(s=>s.id),[id]);
          assert.equal(partial.scenarios[0].outcome,'done');assert.deepEqual(partial.scenarios[0].findings,[]);
          assert.equal(read('run-inputs.json').sourceCommit,process.env.SUT_COMMIT);
          const report=read('navigator-walk.json');assert.deepEqual(report.anomalies,[]);assert.deepEqual(report.findings,[]);
          assert.equal(report.scenarios.length,1);assert.equal(report.scenarios[0].id,id);assert.equal(report.scenarios[0].outcome,'done');
          const index=read('results.json');assert.equal(index.schema,2);assert.deepEqual(index.records.map(row=>row.id),[id]);
          const record=read('scenarios/'+hash(id)+'.json');assert.equal(record.digest,index.records[0].digest);
          assert.equal(hash({result:record.result,findings:record.findings}),record.digest);assert.deepEqual(record.findings,[]);
          const result=record.result;assert.equal(result.scenarioId,id);assert.equal(result.outcome,'done');
          assert.deepEqual(result.reviews.map(r=>r.lane+':'+r.mode),['code:FULL','api:FULL','code:DELTA','api:DELTA','test:FULL','test:DELTA']);
          assert.equal(result.steps.length,70);
          const targets=['task-events','task-events/T-WALK.jsonl','reviews','reviews/T-WALK-task-mode.json'];
          for(const step of result.steps) for(const [key,value] of Object.entries(step.measurement?.work||{}))
            if(key.startsWith('acl_principal_probe:'))assert.equal(value,0,'inherited input unexpectedly acquired principal witnesses');
          for(const n of [28,39,53,54,55,56,57,58]) {
            const step=result.steps.find(s=>s.index===n);assert.ok(step?.measurement?.work);
            for(const target of targets.slice(0,n===53?2:4)) for(const phase of ['initial','final']) {
              const matches=Object.entries(step.measurement.work).filter(([key])=>key.startsWith('acl_probe:'+phase+':')&&key.replace(/\\/g,'/').endsWith('/runtime/'+target));
              assert.equal(matches.length,1);assert.equal(matches[0][1],1,'Every original initial/final ACL object check must remain live');
            }
          }
          console.log('ONE_FAILED_WINDOWS_PRESERVED_DELTA_ACCEPTED: native digest, exact reviews/modes, zero work anomalies, every ACL check retained');
          NODE
      - name: State the exact scope
        if: always()
        run: |
          printf 'Diagnostic only: one failed preserved-DELTA field case on Windows Node24, plus new native ACL input controls.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'No successful jobs/matrix cells are repeated; no full-stand or release acceptance is implied.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-preserved-delta-acl-input-evidence
          path: |
            ${{ runner.temp }}/windows-preserved-delta-acl-input/**
            !${{ runner.temp }}/windows-preserved-delta-acl-input/run-inputs/**
          if-no-files-found: warn
          retention-days: 15
